<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ボン生ゲーム</title>
<style>
:root{--bg:#fff4e6;--card:#fff;--ink:#4a3b32;--accent:#ff8fab;--line:#f1d9c4}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .6s}
#app{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 0 var(--line);margin-bottom:12px}
h1,h2,h3{margin:0 0 8px}
.logo{font-size:44px;font-weight:bold;text-align:center;letter-spacing:2px;line-height:1.5;color:#ff6f91}
.logo rt{font-size:15px;color:#ff9ab0;letter-spacing:0}
.sub{text-align:center;color:#a08a7a;font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:17px;font-weight:bold;color:#fff;background:var(--accent);box-shadow:0 3px 0 #e06a8a;cursor:pointer;margin-top:10px;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e06a8a}
.btn.sec{background:#9ecbff;box-shadow:0 3px 0 #6fa6e6}
.btn.gray{background:#c9bdb4;box-shadow:0 3px 0 #a99d94}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:#ffe3ec;font-weight:bold}
.chip:disabled{opacity:.35}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw.sel{box-shadow:0 0 0 3px var(--accent)}
.lab{font-size:13px;font-weight:bold;color:#9a7f6e;margin-top:6px}
.center{text-align:center}
.pre{display:flex;justify-content:center;background:#fff8f0;border-radius:16px;padding:6px}
input[type=text]{font-size:18px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;width:60%;font-family:inherit;color:var(--ink)}
.namebox{display:flex;align-items:center;gap:6px;justify-content:center;font-size:20px;font-weight:bold}
.talk{display:flex;gap:10px;align-items:center}
.talk .bub{flex:1;font-size:17px;line-height:1.8}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px}
.g{font-size:12px}
.bar{height:9px;border-radius:6px;background:#f2e6da;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.2;text-align:center;position:relative;border:2px solid transparent;font-weight:bold;color:#6b574a}
.cell.now{border-color:var(--accent);box-shadow:0 0 0 2px #ffd0dd}
.cell svg{width:76%;height:auto}
.cell{box-shadow:0 3px 0 rgba(0,0,0,.09);font-size:9px;gap:1px;overflow:hidden}
.cell .ic{font-size:19px;line-height:1}
.cell .ci{width:26px;height:26px;object-fit:contain}
.cell .no{position:absolute;top:1px;left:4px;font-size:8px;color:#0004;font-weight:bold}
.cell.past{opacity:.5;filter:saturate(.6)}
.cell.now{animation:glow 1.2s infinite;z-index:2;transform:scale(1.08)}
.cell.now svg{animation:hop .7s infinite}
.cell.goal{background:linear-gradient(135deg,#ffe27a,#ffb3c8)!important;color:#a24}
@keyframes glow{50%{box-shadow:0 0 0 5px #ffd0dd,0 3px 0 rgba(0,0,0,.09)}}
@keyframes hop{50%{transform:translateY(-3px)}}
.dice{width:78px;height:78px;margin:0 auto;border-radius:18px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;font-size:44px;color:#ff6f91;min-height:0}
.dice.rolling{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-12deg) translateY(-4px)}75%{transform:rotate(12deg) translateY(2px)}}
.ov{animation:fade .25s}
.ov .card{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}}
.card{border:2px solid #fff;background:linear-gradient(#fff,#fffaf4)}
.board{background:repeating-linear-gradient(45deg,transparent 0 10px,#0000000a 10px 11px);border-radius:12px}
.btn{transition:filter .15s}.btn:hover{filter:brightness(1.05)}
.spark{position:fixed;pointer-events:none;z-index:20;font-size:22px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
.bar i{background-image:linear-gradient(#fff5,#0000 60%)}
.dice{font-size:46px;font-weight:bold;text-align:center;min-height:62px}
.ov{position:fixed;inset:0;background:#4a3b3288;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov .card{max-width:440px;width:100%;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.up,.dn{font-size:13px;font-weight:bold;border-radius:999px;padding:3px 10px}
.up{background:#dff7e1;color:#2d8a43}
.dn{background:#ffe1e1;color:#c24545}
.tag{display:inline-block;font-size:12px;background:#ffe3ec;color:#d6527a;border-radius:999px;padding:2px 10px;font-weight:bold}
.small{font-size:12px;color:#a08a7a}
.por{width:auto;max-width:150px;object-fit:contain;display:block;margin:0 auto}
.pr{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:12px}
.mrow{display:flex;align-items:center;gap:8px;font-size:12px}
.mrow img{height:56px;width:auto;max-width:56px;object-fit:contain}
</style>
</head>

  if(stat==='stress'){ if(delta>0) m-=w; }
  else if(delta>0) m+=w;
 });
 return Math.round(delta*m);
}
function restMult(){return (S.main==='hazukashi'?.5:0)+(S.sub==='hazukashi'?.25:0);}
function change(stat,delta,rest){
 if(rest&&((stat==='hp'&&delta>0)||(stat==='stress'&&delta<0))) delta=Math.round(delta*(1+restMult()));
 delta=mult(stat,delta);
 if(stat==='money'){const b=S.money;S.money=Math.max(0,S.money+delta);return S.money-b;}
 const b=S.st[stat];S.st[stat]=Math.max(0,Math.min(100,b+delta));return S.st[stat]-b;
}
function applyEff(e,bonus){
 const out=[],d=Object.assign({},e.d||{});
 if(bonus) Object.keys(bonus).forEach(k=>d[k]=(d[k]||0)+bonus[k]);
 Object.keys(d).forEach(k=>{
  let v=d[k];
  if(k==='money'&&v<0&&e.ins) v=Math.round(v*(1-INS[S.ins].cut));
  const r=change(k,v,e.rest); if(r!==0) out.push([k,r]);
 });
 if(e.item){S.items+=e.item;out.push(['item',e.item]);}
 if(e.baby){S.kids++;}
 if(e.bon&&e.like){S.like[e.bon]=(S.like[e.bon]||0)+e.like;}
 if(e.likes) Object.keys(e.likes).forEach(k=>S.like[k]=(S.like[k]||0)+e.likes[k]);
 if(e.coll&&!S.coll.includes(e.coll)){S.coll.push(e.coll);out.push(['coll',1,'あつめた：'+e.coll]);}
 return out;
}
function poseOf(k,ev){
 if(ev&&ev.pose) return ev.pose;
 if(k==='oko'&&(S.like.oko||0)>=12) return 2;
 return 1;
}

/* おきゅうりょう・せいかつひ */
function payroll(months){
 const yrs=months/12, st=S.stage; let inc=0, exp=0;
 if(st===3) inc=({work:150,free:60}[S.course]||0)*M*yrs*0.85;
 else if(st===4||st===5) inc=(S.job?S.job.sal:200)*M*yrs*(st===5?1.15:1)*0.85;
 else if(st===6) inc=150*M*yrs;
 if(st>=4){
  exp+=(st===6?70:90)*M*yrs;
  if(S.house==='own'&&S.loan>0){const p=Math.min(S.loan,100*M*yrs);S.loan-=p;exp+=p;} else if(S.house!=='own') exp+=60*M*yrs;
  exp+=INS[S.ins].cost*M*yrs;
  if(st<=5) exp+=S.kids*20*M*yrs;
 }
 const net=Math.round(inc-exp);
 const out=[];
 if(st>=3&&net!==0){
  const before=S.money, r=change('money',net);
  if(net<0&&before+net<0){ change('stress',5); out.push(['stress',5,'ストレス(おかねが たりない)']); }
  out.push(['money',r,'おきゅうりょう(ぜいきん・せいかつひ ひいて)']);
 }
 if(st>=5){ const n=st===5?2:4; const r=change('hp',-n); if(r) out.push(['hp',r,'たいりょく(としの せい)']); }
 return out;
}

async function roll(free){
 if(busy||S.done) return;
 busy=true; play($('#app'));
 if(free) S.items--;
 const d=rnd(6);
 await tumble(d);
 const st=STAGES[S.stage], B=st.board;
 let pay=[];
 if(!free){
  const step=(st.b-st.a)/((B.length-1)/3.5);
  S.months=Math.min(st.b,S.months+step);
  pay=payroll(step);
  if(S.stage>=1){ change('stress',S.stage>=3?1:0); change('happy',S.stage>=3?-3:-1); }
 }
 for(let i=0;i<d&&S.pos<B.length-1;i++){ S.pos++; play($('#app')); const e=$('#dice'); if(e) e.textContent=d; await sleep(220); }
 await resolveCell(pay);
 save();
 if(S.pos>=B.length-1){ await stageClear(); busy=false; if(!S.done) play($('#app')); return; }
 busy=false; play($('#app'));
}

/* ---------- マスの処理 ---------- */
function pickEvent(kind){
 const L=EVS.filter(e=>e.k===kind&&S.stage>=e.s[0]&&S.stage<=e.s[1]&&(!e.if||e.if()));
 if(!L.length) return null;
 let tot=0;const w=L.map(e=>{const x=(e.w||1)/(1+(S.used[e.id]||0)*2);tot+=x;return x;});
 let r=Math.random()*tot,i=0;for(;i<L.length-1;i++){r-=w[i];if(r<=0)break;}
 const e=L[i];S.used[e.id]=(S.used[e.id]||0)+1;return e;
}
async function playEvent(ev,kind,pay){
 const bonus=(kind==='event'||kind==='chance')&&(S.main==='chosen'||S.sub==='chosen')?{happy:S.main==='chosen'?3:2}:null;
 let e=ev, text=ev.x;
 if(ev.ch){
  const i=await choose({tag:LABEL[kind],title:ev.t,text:ev.x,svg:ev.bon?npcSVG(ev.bon,120,poseOf(ev.bon,ev)):null,options:ev.ch.map(c=>({l:c.l}))});
  const c=ev.ch[i]; e=Object.assign({ins:ev.ins,rest:ev.rest},c.o,{d:c.d}); text=c.r;
 }
 let changes=applyEff(e,bonus);
 if(pay&&pay.length){changes=pay.concat(changes);}
 const k=ev.bon;
 await showCard({tag:LABEL[kind],title:ev.t,text,svg:k?npcSVG(k,130,poseOf(k,ev)):null,bonName:k?BON[k].n:null,rankText:k?rank(S.like[k]||0):null,changes});
}
async function resolveCell(pay){
 const t=STAGES[S.stage].board[S.pos];
 if(t==='start') return;
 if(t==='goal'){ S.__pay=pay; return; }
 S.__pay=null;
 if(FIRST[t]&&!S.seen[t]){ S.seen[t]=true; return playEvent(FIRST[t],t,pay); }
 if(t==='shop') return shopTile(pay);
 if(t==='love') return loveTile(pay);
 if(t==='work'&&S.stage>=4&&S.job&&Math.random()<.5){
  const j=S.job; const ev={t:j.ev[0],x:j.ev[1],d:j.ev[2]};
  if(j.like) ev.likes=j.like;
  return playEvent(ev,'work',pay);
 }
 if(t==='trouble'&&S.omamori>0){
  S.omamori--;
  const ev=pickEvent('trouble');
  await showCard({tag:LABEL[t],title:'おまもりが まもってくれた！',text:'わるい ことが おきそうに なったけど、おまもりが ひかって まもってくれた。(「'+(ev?ev.t:'トラブル')+'」を さけられたよ)',changes:pay||[]});
  return;
 }
 let ev=pickEvent(t);
 if(!ev) ev=pickEvent('event')||{t:'のんびり',x:'ちょっと ひとやすみ。',d:{stress:-3}};
 return playEvent(ev,t,pay);
}

  if(it.item||it.om||it.car) { /* 続けて かえる */ }
 }
 if(first&&changes.length) await showCard({tag:LABEL.shop,title:'いってきました',text:'きょうは なにも かわずに おみせを でた。',changes});
}

/* こいバナ */
async function loveTile(pay){
 if(S.stage<3){ const ev=pickEvent('event'); return playEvent(ev,'event',pay); }
 const P=S.partner;
 const cand=Object.keys(BON).filter(k=>(S.like[k]||0)>=20&&!S.rej[k]);
 const tag=LABEL.love;
 if(P&&P.married){
  return playEvent({t:'ふうふの じかん',x:P.n+'と ゆっくり おちゃを のむ。なんでもない じかんが いちばん しあわせ。',d:{happy:6,stress:-5},bon:P.bon||null,like:P.bon?2:0},'love',pay);
 }
 if(!P){
  if(cand.length&&Math.random()<.65){
   const k=pickOne(cand);
   const i=await choose({tag,title:BON[k].n+'への きもち',text:BON[k].n+'と いっしょに いると、むねが どきどき…。こくはく、してみる？',svg:npcSVG(k,120,1),options:[{l:'こくはく する！'},{l:'まだ はやい',sec:true}]});
   if(i===0){
    const p=Math.min(.9,Math.max(.15,.2+(S.like[k]||0)/100+(S.st.popular+S.st.happy)/500));
    if(Math.random()<p){
     S.partner={n:BON[k].n,bon:k,love:30,married:false}; addLog(BON[k].n+'と こいびとに なった');
     return playEvent({t:'こくはく せいこう！',x:'「…よろしく おねがいします」。'+BON[k].n+'が まっかな かおで うなずいた。',d:{happy:15,stress:-8},bon:k,like:6},'love',pay);
    }
    S.rej[k]=1;
    return playEvent({t:'ごめんなさい…',x:BON[k].n+'は こまった かおで いった。「ずっと ともだちで いたいな」。でも、なかは よいまま。',d:{stress:8,happy:-6},bon:k,like:0},'love',pay);
   }
   return playEvent({t:'もうすこし だけ',x:'まだ きもちを つたえるのは はやい きがする。いっしょに いられるだけで しあわせ。',d:{happy:3},bon:k,like:2},'love',pay);
  }
  const nm=pickOne(TOWN);
  S.partner={n:nm,bon:null,love:10,married:false};
  return playEvent({t:'きに なる ひと',x:'まちの かどで '+nm+'と ぶつかって しまった。あやまった とき、めが あって…どきん。',d:{happy:5,stress:2}},'love',pay);
 }
 if(P.love<30){
  P.love+=20;
  const d=pickOne([['ふたりで さんぽ','いろどり町を ふたりで さんぽ。てが ふれて、ふたりとも まっかに なった。'],['おそろいの プレゼント','おそろいの ちいさな プレゼントを こうかん。たからものが ふえた。'],['ゆうやけの ベンチ','ベンチで ならんで ゆうやけを みた。なにも いわなくても いい。']]);
  return playEvent({t:d[0],x:d[1],d:{happy:8,stress:-4},bon:P.bon||null,like:P.bon?2:0},'love',pay);
 }
 const p=Math.min(.92,.35+P.love/150+(S.st.popular+S.st.friend)/500);
 const i=await choose({tag,title:P.n+'との みらい',text:P.n+'とは、すっかり なかよし。そろそろ、けっこんを もうしこんでみる？',svg:P.bon?npcSVG(P.bon,120,1):null,options:[{l:'プロポーズ する！'},{l:'まだ いい(このままで)',sec:true}]});
 let changes=pay||[];
 if(i===0){
  if(Math.random()<p){
   P.married=true; addLog(P.n+'と けっこん');
   changes=changes.concat(applyEff({d:{happy:20,stress:-10},bon:P.bon,like:P.bon?6:0}));
   await showCard({tag,title:'けっこん！',text:'「はい、よろこんで」。'+P.n+'が なみだを ながして うなずいた。おめでとう！',svg:P.bon?npcSVG(P.bon,130,1):null,changes});
   return;
  }
  P.love=Math.max(10,P.love-10);
  return playEvent({t:'ざんねん…',x:P.n+'は「もうすこし じかんが ほしいな」と いった。きっと また チャンスは ある。',d:{stress:6,happy:-4}},'love',pay);
 }
 return playEvent({t:'もうすこし このまま',x:'いまの ままで じゅうぶん しあわせ。ふたりの じかんを たいせつに。',d:{happy:4}},'love',pay);
}

/* ---------- ステージの はじまり ---------- */
async function onStart(i){
 const st=STAGES[i];
 if(i===3){
  const mk=(l,sub,dis)=>({l,sub,dis});
  const idx=await choose({tag:'しんろ',title:'どんな みちを すすむ？',text:'そろそろ しんろを きめるじき。いまの がくりょく: '+S.st.study+'。えらんだ みちで、えらべる しごとが かわるよ。',
   options:[mk('だいがくに すすむ','がくりょく50 いじょう / いろんな しごとを えらべる',S.st.study<50),mk('せんもんがっこうに すすむ','がくりょく30 いじょう / てに しょくの しごとに つよい',S.st.study<30),mk('すぐ はたらく','アルバイトより おきゅうりょうが いい'),mk('じゆうに すごす','しばられない みち / のびのび してみる')]});
  S.course=['univ','senmon','work','free'][idx];
  addLog('しんろ：'+['だいがく','せんもん がっこう','すぐ しゅうしょく','じゆうに すごす'][idx]);
  if(S.course==='univ'){change('study',6);change('stress',6);} else if(S.course==='senmon'){change('study',4);} else if(S.course==='free'){change('happy',6);}
 }
 if(i===4){
  const allowed=j=>!j.course||S.course==='univ'||j.course.includes(S.course);
  const reason=j=>{const m=[];Object.keys(j.r).forEach(k=>{if(S.st[k]<j.r[k]) m.push(SNAME[k]+j.r[k]+'いじょう');});if(!allowed(j)) m.push('しんろが ちがう');return m.join('・');};
  const opts=JOBS.map(j=>{const rs=reason(j);return {l:j.n,group:j.g,sub:'ねんしゅう '+j.sal+'まんえん くらい'+(rs?' (むり: '+rs+')':''),dis:!!rs};});
  const idx=await choose({tag:'しゅうしょく',title:'どんな しごとを する？',text:'おとなに なった！ しごとを えらぼう。(がくりょく・たいりょく・にんき・しんろで えらべる しごとが かわるよ)',options:opts});
  S.job=JOBS[idx]; addLog('しごと：'+S.job.n);
  const ii=await choose({tag:'ほけん',title:'ほけんに はいる？',text:'びょういんや トラブルに そなえる ほけん。ぜいきんと ねんきんは じどうで ひかれるよ。',options:INS.map(x=>({l:x.n,sub:x.sub}))});
  S.ins=ii; addLog('ほけん：'+INS[ii].n);
  const hi=await choose({tag:'すまい',title:'おうちを どうする？',text:'ローンで おうちを かうか、ちんたいで くらすか。(ローンは まいとし 100まんえん ずつ かえす)',options:[{l:'ローンで おうちを かう',sub:'1800まんえん / こうふくど↑ ストレス↑'},{l:'ちんたいで くらす',sub:'まいとし 60まんえん / きがるに ひっこせる',sec:true}]});
  if(hi===0){S.house='own';S.loan=1800*M;change('happy',10);change('stress',5);addLog('ローンで おうちを かった');} else {S.house='rent';addLog('ちんたいで くらす');}
 }
 save();
}
async function stageClear(){
 const st=STAGES[S.stage];
 S.months=st.b;
 const pay=S.__pay||[]; S.__pay=null;
 if(S.stage===STAGES.length-1){
  S.done=true; save(); addLog('せいれいに なった');
  await showCard({tag:'ゴール！',title:'ながい ボン生の おわり',text:'ゆっくり ゆっくり、ここまで あるいてきたよ。'+S.name+'ボンは いま、あたらしい すがたに なろうとしている…。',svg:bonSVG(S.opts,100),changes:pay});
  recordLife(); save(); go('end'); return;
 }
 addLog(st.n+'を おえた');
 await showCard({tag:'ステージ クリア',title:st.n+' おしまい',text:ageText(S.months)+'に なったよ。つぎは「'+STAGES[S.stage+1].n+'」。',svg:bonSVG(S.opts,100),changes:pay});
 S.stage++; S.pos=0; S.months=STAGES[S.stage].a;
 render();
 await showCard({tag:STAGES[S.stage].n,title:STAGES[S.stage].n+' の はじまり',text:STAGES[S.stage].intro,svg:null,changes:[]});
 await onStart(S.stage);
 save();
}

/* ---------- エンディング・きろく ---------- */
const ENDS=[
 {id:'all',n:'にじいろの なかまたち',hide:1,cond:()=>Object.keys(BON).every(k=>(S.like[k]||0)>=30),x:'7にんの ボンが ぜんいん、そばに あつまってくれた。「ありがとう」の こえが かさなって、ひとつの にじに なった。'},
 {id:'rainbow',n:'にじいろの せいれい',cond:()=>S.st.hp>=50&&S.st.happy>=50&&S.st.popular>=50&&S.st.friend>=60&&S.st.study>=50&&S.st.stress<=40,x:'なにもかも ほどよく みたされた、まさに にじいろの ボン生。からだじゅうが きらきら かがやいている。'},
 {id:'rich',n:'おおがねもち ボン',cond:()=>S.money>=60000000,x:'たくさんの おかねで、まちの みんなに おいしいものを ふるまった。ふところも こころも ゆたかな ボン生。'},
 {id:'family',n:'かぞくの だんらん',cond:()=>S.partner&&S.partner.married&&S.kids>=2&&S.st.happy>=55,x:'おおぜいの かぞくに かこまれて、まいにちが にぎやかだった。わらいごえが いつまでも ひびく。'},
 {id:'sage',n:'ものしり はかせ',cond:()=>S.st.study>=75,x:'たくさんの ことを まなんだ ボン生。ものしり はかせとして、まちの ボンたちに したわれた。'},
 {id:'star',n:'まちの にんきもの',cond:()=>S.st.popular>=75,x:'どこへ いっても「あっ、{N}ボンだ！」と こえを かけられる にんきもの。まちじゅうが ともだちだった。'},
 {id:'friend',n:'ともだち いっぱい',cond:()=>S.st.friend>=75,x:'ともだちの わが どこまでも ひろがった ボン生。おくった ことばは みんなの むねに のこった。'},
 {id:'solo',n:'ひとりの のんびり',cond:()=>!S.partner&&S.st.stress<=30,x:'だれにも しばられず、じぶんの ペースで あるいた ボン生。ひとりの じかんも、とても すてき。'},
 {id:'drama',n:'ドタバタ ボン生',cond:()=>S.st.stress>=65,x:'いろいろ あって、いつも ばたばた。でも ふりかえれば、ぜんぶ わらい話。なかなか おもしろい ボン生だった。'},
 {id:'normal',n:'ふつうの しあわせ',cond:()=>true,x:'とくべつな ことは ないけれど、おだやかな まいにちが ずっと つづいた。それが いちばんの しあわせ。'}
];
const TITLES=[
 {id:'first',n:'はじめての ボン生',d:'1どめの ボン生を おえる',c:()=>true},
 {id:'sage',n:'はかせボン',d:'がくりょく 80 いじょう',c:()=>S.st.study>=80},
 {id:'star',n:'にんきボン',d:'にんき 80 いじょう',c:()=>S.st.popular>=80},
 {id:'rich',n:'おかねもちボン',d:'おかねが 6000まんえん いじょう',c:()=>S.money>=60000000},
 {id:'friend',n:'ともだちボン',d:'こうゆうど 80 いじょう',c:()=>S.st.friend>=80},
 {id:'allbon',n:'ボンたちの しんゆう',d:'7にんの ボンと ぜんいん しんゆうに なる',c:()=>Object.keys(BON).every(k=>(S.like[k]||0)>=30)},
 {id:'family',n:'かぞくボン',d:'けっこんして こどもが 2にん いじょう',c:()=>S.partner&&S.partner.married&&S.kids>=2},
 {id:'solo',n:'おひとりさまボン',d:'けっこんしないで ストレス 25 いかで おわる',c:()=>!S.partner&&S.st.stress<=25},
 {id:'traveler',n:'あつめボン',d:'おみやげ・おもいでを 6こ いじょう あつめる',c:()=>S.coll.length>=6},
 {id:'genki',n:'ぴんぴんボン',d:'たいりょく 70 いじょうで おわる',c:()=>S.st.hp>=70},
 {id:'drama',n:'ドタバタボン',d:'ストレス 70 いじょうで おわる',c:()=>S.st.stress>=70},
 {id:'koi',n:'こいの ボン',d:'7にんの ボンと こいびとに なる',c:()=>S.partner&&S.partner.bon},
 {id:'house',n:'おうちボン',d:'ローンを ぜんぶ かえす',c:()=>S.house==='own'&&S.loan<=0},
 {id:'doc',n:'おいしゃボン',d:'おいしゃさんに なる',c:()=>S.job&&S.job.n==='おいしゃさん'},
 {id:'hari',n:'ツボボン',d:'しんきゅうしに なる',c:()=>S.job&&S.job.n==='しんきゅうし'}
];
function getEnd(){return ENDS.find(e=>e.cond());}
function scoreOf(){
 const v=(S.st.hp+S.st.happy+S.st.popular+S.st.friend+S.st.study+(100-S.st.stress))/6;
 const b=Object.keys(BON).filter(k=>(S.like[k]||0)>=12).length*1.5+(S.partner&&S.partner.married?4:0)+Math.min(8,S.money/5000000);
 return Math.round(v+b);
}
function rankOf(sc){return sc>=80?'S':sc>=65?'A':sc>=50?'B':'C';}
function recordLife(){
 if(S.recorded) return; S.recorded=true;
 const r=recLoad(), E=getEnd(), got=TITLES.filter(t=>t.c()).map(t=>t.id);
 got.forEach(id=>{r.titles[id]=1;}); r.ends[E.id]=1;
 r.lives.unshift({name:S.name,gender:S.opts.gender,job:S.job?S.job.n:'なし',end:E.n,rank:rankOf(scoreOf()),score:scoreOf()});
 r.lives=r.lives.slice(0,10); recSave(r); S.earned=got;
}
function ending(a){
 const E=getEnd(), sc=scoreOf(), rk=rankOf(sc);
 const met=Object.keys(BON).map(k=>`<div class="mrow">${npcSVG(k,56,(S.like[k]||0)>0?1:4)}<span>${BON[k].n}<br><b>${rank(S.like[k]||0)}</b></span></div>`).join('');
 const st=STATS.map(([k,n])=>`<div class="g">${n} … <b>${S.st[k]}</b></div>`).join('');
 const earned=(S.earned||[]).map(id=>TITLES.find(t=>t.id===id)).filter(Boolean).map(t=>`<span class="tag">${t.n}</span>`).join(' ');
 const log=S.log.slice(-14).map(t=>`<div class="small">・${t}</div>`).join('');
 a.innerHTML=`<div class="card center"><span class="tag">エンディング</span><h2 style="margin-top:8px">${E.n}</h2><div class="pre">${bonSVG(S.opts,150)}</div>
 <p style="font-size:15px;line-height:1.8">${E.x.replace('{N}',S.name)}</p>
 <p style="font-size:15px;line-height:1.8">そして ${S.name}ボンは、からだが にじいろに かがやいて…精霊として せいちょうし、ほかの ボンたちを みまもる がわに なったのでした。</p>
 <div style="font-size:34px;font-weight:bold;color:#ff6f91">ランク ${rk} <span style="font-size:14px">(${sc}てん)</span></div></div>
 <div class="card"><h3>さいごの ステータス</h3><div class="gauges" style="text-align:left">${st}<div class="g">おかね … <b>${fmt(S.money)}</b></div></div>
 <div class="small" style="margin-top:6px">${S.job?'しごと: '+S.job.n+' / ':''}${S.partner?(S.partner.married?'おしあわせ: ':'おともだち いじょう: ')+S.partner.n+' / ':'ひとりで すごした / '}こども ${S.kids}にん</div></div>
 <div class="card"><h3>であった ボンたち</h3><div class="gauges">${met}</div></div>
 <div class="card"><h3>ゲットした しょうごう</h3><div class="chips">${earned||'<span class="small">なし</span>'}</div>
 <h3 style="margin-top:10px">あつめた おもいで(${S.coll.length}こ)</h3><div class="small">${S.coll.length?S.coll.join(' / '):'まだ ないよ'}</div></div>
 <div class="card"><h3>ボン生の あしあと</h3>${log}</div>
 <div class="card center"><button class="btn" id="again">もういちど あそぶ</button><button class="btn sec" id="rc">きろくを みる</button><button class="btn gray" id="tt">タイトルへ</button></div>`;
 $('#again').onclick=()=>{wipe();S=newState();go('prologue');};
 $('#rc').onclick=()=>{S.screen='rec';render();};
 $('#tt').onclick=()=>{S=newState();go('title');};
}
function recScreen(a){
 const r=recLoad();
 const tt=TITLES.map(t=>`<div class="small">${r.titles[t.id]?'★ <b>'+t.n+'</b>':'☆ ？？？'}(${t.d})</div>`).join('');
 const ee=ENDS.map(e=>`<div class="small">${r.ends[e.id]?'★ <b>'+e.n+'</b>':(e.hide?'☆ ？？？(ひみつ)':'☆ ？？？')}</div>`).join('');
 const lv=r.lives.map(l=>`<div class="small">・${l.name}ボン(${l.gender==='boy'?'おとこのこ':'おんなのこ'}) / ${l.job} / ${l.end} / ランク${l.rank}(${l.score}てん)</div>`).join('')||'<div class="small">まだ ないよ</div>';
 a.innerHTML=`<div class="card"><h2 class="center">きろく</h2><h3>しょうごう(${Object.keys(r.titles).length}/${TITLES.length})</h3>${tt}</div>
 <div class="card"><h3>エンディング(${Object.keys(r.ends).length}/${ENDS.length})</h3>${ee}</div>
 <div class="card"><h3>いままでの ボン生</h3>${lv}</div>
 <div class="card"><button class="btn gray" id="bk">もどる</button></div>`;
 $('#bk').onclick=()=>go(S.done?'end':'title');
}

S=newState(); render();
window.__bon={get S(){return S}};
})();
</script>
